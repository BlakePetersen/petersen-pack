# ABOUTME: CI pipeline for petersen-group monorepo.
# ABOUTME: Runs typecheck, lint, build, test, and link-check on push/PR to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir apps/blakepetersen.io/.next/server/app --fallback-extensions html --exclude '_next/.*' --exclude 'feed\.xml' --exclude 'images\.ctfassets\.net' apps/blakepetersen.io/.next/server/app/**/*.html apps/blakepetersen.io/content/**/*.mdx
          fail: true
