# ABOUTME: GitHub Actions workflow for Claude-powered pull request review.
# ABOUTME: Posts a single review per push with a verdict and inline comments.

name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-ai')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Review pull request
        run: npx tsx .github/scripts/ai-review.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
