<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Flyer - Dual Tone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0B0B0E;
    color: #FFFFFF;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .flyer {
    width: 1080px;
    height: 1350px;
    background: #0B0B0E;
    position: relative;
    overflow: hidden;
  }

  /* Grain */
  .flyer::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
    background-size: 256px;
    z-index: 10;
    pointer-events: none;
  }

  /* Geometric accent - diagonal line */
  .geo-line {
    position: absolute;
    width: 2px;
    height: 500px;
    background: linear-gradient(to bottom, #1F6BFF, transparent);
    top: 0;
    right: 200px;
    transform: rotate(15deg);
    transform-origin: top;
    z-index: 3;
    opacity: 0.4;
  }

  .geo-line-2 {
    position: absolute;
    width: 1px;
    height: 400px;
    background: linear-gradient(to top, #B6FF00, transparent);
    bottom: 0;
    left: 120px;
    transform: rotate(-10deg);
    transform-origin: bottom;
    z-index: 3;
    opacity: 0.3;
  }

  /* Photo - offset right, cropped */
  .photo-block {
    position: absolute;
    top: 140px;
    right: -40px;
    width: 480px;
    height: 640px;
    overflow: hidden;
    z-index: 2;
    clip-path: polygon(15% 0%, 100% 0%, 100% 100%, 0% 100%);
  }

  .photo-block img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%;
    filter: grayscale(60%) contrast(1.2) brightness(0.7);
  }

  .photo-block::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to left,
      transparent 50%,
      #0B0B0E 100%
    );
  }

  /* Content positioned left */
  .content {
    position: relative;
    z-index: 5;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 80px 70px;
  }

  .birthday-tag {
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #1F6BFF;
    padding: 10px 20px;
    border: 1px solid rgba(31, 107, 255, 0.3);
    display: inline-block;
    align-self: flex-start;
  }

  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 600px;
  }

  .artist-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 170px;
    line-height: 0.82;
    letter-spacing: -2px;
    text-transform: uppercase;
  }

  .artist-name .line1 { color: #B6FF00; text-shadow: 0 0 60px rgba(182, 255, 0, 0.3); }
  .artist-name .line2 { color: #1F6BFF; text-shadow: 0 0 60px rgba(31, 107, 255, 0.3); }
  .artist-name .line3 { color: #FFFFFF; }

  .sub-line {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-top: 40px;
  }

  .live-dj {
    font-weight: 300;
    font-size: 15px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #9FA3A7;
  }

  .accent-bar {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, #9FA3A7, transparent);
    max-width: 200px;
  }

  .bottom-content {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .event-block {
    display: flex;
    align-items: baseline;
    gap: 40px;
  }

  .event-date {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 90px;
    letter-spacing: 2px;
    color: #FFFFFF;
    line-height: 1;
  }

  .event-meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .event-day {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: #FFFFFF;
    letter-spacing: 2px;
    line-height: 1;
  }

  .event-venue {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #B6FF00;
  }

  .tagline {
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.3);
    text-align: right;
    line-height: 2;
  }
</style>
</head>
<body>
<div class="flyer">
  <div class="geo-line"></div>
  <div class="geo-line-2"></div>

  <div class="photo-block">
    <img src="https://iwdr7kqxwo00nm51.public.blob.vercel-storage.com/images/standalone/1769736137927-Ashley-119.webp" alt="Ashley">
  </div>

  <div class="content">
    <div class="birthday-tag">It's My Birthday</div>

    <div class="main-content">
      <div class="artist-name">
        <span class="line1">What</span><br>
        <span class="line2">So</span><br>
        <span class="line3">Not</span>
      </div>
      <div class="sub-line">
        <span class="live-dj">Live DJ Set</span>
        <span class="accent-bar"></span>
      </div>
    </div>

    <div class="bottom-content">
      <div class="event-block">
        <div class="event-date">2.20</div>
        <div class="event-meta">
          <div class="event-day">Friday</div>
          <div class="event-venue">Audio</div>
        </div>
      </div>
      <div class="tagline">Bass heavy.<br>Late night.<br>Unforgettable.</div>
    </div>
  </div>
</div>
</body>
</html>
