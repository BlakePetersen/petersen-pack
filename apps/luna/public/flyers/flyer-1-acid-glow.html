<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Flyer - Acid Glow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0B0B0E;
    color: #FFFFFF;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .flyer {
    width: 1080px;
    height: 1350px;
    background: #0B0B0E;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Grain overlay */
  .flyer::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    background-size: 256px;
    z-index: 10;
    pointer-events: none;
  }

  /* Subtle radial glow behind artist name */
  .glow-bg {
    position: absolute;
    width: 800px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(182, 255, 0, 0.08) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
  }

  /* Photo circle */
  .photo-container {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(182, 255, 0, 0.3);
    margin-bottom: 48px;
    position: relative;
    z-index: 5;
  }

  .photo-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    filter: grayscale(30%) contrast(1.1);
  }

  .birthday-tag {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #9FA3A7;
    margin-bottom: 60px;
    z-index: 5;
  }

  .artist-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 180px;
    line-height: 0.85;
    letter-spacing: -2px;
    text-transform: uppercase;
    color: #B6FF00;
    text-align: center;
    z-index: 5;
    text-shadow:
      0 0 80px rgba(182, 255, 0, 0.3),
      0 0 160px rgba(182, 255, 0, 0.1);
    filter: blur(0.3px);
  }

  .live-dj {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 18px;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: #FFFFFF;
    margin-top: 32px;
    z-index: 5;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: #9FA3A7;
    margin: 48px 0;
    z-index: 5;
  }

  .event-details {
    text-align: center;
    z-index: 5;
  }

  .event-date {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    letter-spacing: 4px;
    color: #FFFFFF;
  }

  .event-venue {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 20px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #9FA3A7;
    margin-top: 8px;
  }

  .tagline {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 14px;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.4);
    position: absolute;
    bottom: 60px;
    z-index: 5;
  }
</style>
</head>
<body>
<div class="flyer">
  <div class="glow-bg"></div>

  <div class="birthday-tag">It's My Birthday</div>

  <div class="photo-container">
    <img src="https://iwdr7kqxwo00nm51.public.blob.vercel-storage.com/images/standalone/1769736137927-Ashley-119.webp" alt="Ashley">
  </div>

  <div class="artist-name">
    What So<br>Not
  </div>

  <div class="live-dj">Live DJ Set</div>

  <div class="divider"></div>

  <div class="event-details">
    <div class="event-date">Friday 2.20</div>
    <div class="event-venue">Audio</div>
  </div>

  <div class="tagline">Bass heavy. &nbsp; Late night. &nbsp; Unforgettable.</div>
</div>
</body>
</html>
