<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Flyer - Distorted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0B0B0E;
    color: #FFFFFF;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .flyer {
    width: 1080px;
    height: 1350px;
    background: #0B0B0E;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Grain */
  .flyer::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.07'/%3E%3C/svg%3E");
    background-size: 256px;
    z-index: 10;
    pointer-events: none;
  }

  .top-section {
    padding: 60px 70px;
    z-index: 5;
  }

  .birthday-tag {
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #9FA3A7;
  }

  /* Stretched artist name - the visual anchor */
  .artist-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 5;
    position: relative;
  }

  .artist-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 160px;
    line-height: 0.78;
    letter-spacing: -2px;
    text-transform: uppercase;
    text-align: center;
    color: #B6FF00;
    transform: scaleY(1.8);
    transform-origin: center;
    text-shadow:
      0 0 60px rgba(182, 255, 0, 0.3),
      0 0 120px rgba(182, 255, 0, 0.1);
    filter: blur(0.4px);
  }

  /* Photo strip behind text */
  .photo-strip {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 280px;
    height: 600px;
    overflow: hidden;
    opacity: 0.2;
    z-index: -1;
  }

  .photo-strip img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%;
    filter: grayscale(100%) contrast(1.5);
  }

  .live-dj {
    font-weight: 300;
    font-size: 15px;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: #FFFFFF;
    margin-top: 80px;
    z-index: 5;
  }

  .bottom-section {
    padding: 0 70px 60px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 5;
  }

  .bottom-left {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .event-date {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 68px;
    letter-spacing: 3px;
    color: #FFFFFF;
    line-height: 1;
  }

  .event-venue {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #B6FF00;
  }

  .bottom-right {
    text-align: right;
  }

  .tagline {
    font-weight: 300;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.3);
    line-height: 2;
    letter-spacing: 1px;
  }

  /* Horizontal scan lines */
  .scanlines {
    position: absolute;
    inset: 0;
    z-index: 9;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0, 0, 0, 0.03) 3px,
      rgba(0, 0, 0, 0.03) 4px
    );
  }
</style>
</head>
<body>
<div class="flyer">
  <div class="scanlines"></div>

  <div class="top-section">
    <div class="birthday-tag">It's My Birthday</div>
  </div>

  <div class="artist-section">
    <div class="photo-strip">
      <img src="https://iwdr7kqxwo00nm51.public.blob.vercel-storage.com/images/standalone/1769736137927-Ashley-119.webp" alt="Ashley">
    </div>
    <div class="artist-name">
      What<br>So<br>Not
    </div>
    <div class="live-dj">Live DJ Set</div>
  </div>

  <div class="bottom-section">
    <div class="bottom-left">
      <div class="event-date">FRI 2.20</div>
      <div class="event-venue">Audio</div>
    </div>
    <div class="bottom-right">
      <div class="tagline">Bass heavy.<br>Late night.<br>Unforgettable.</div>
    </div>
  </div>
</div>
</body>
</html>
