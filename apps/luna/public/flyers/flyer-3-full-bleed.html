<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Flyer - Full Bleed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0B0B0E;
    color: #FFFFFF;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .flyer {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
  }

  .bg-image {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .bg-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 10%;
    filter: grayscale(50%) contrast(1.2) brightness(0.55);
  }

  /* Dark gradient overlay */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    background:
      linear-gradient(to bottom,
        rgba(11, 11, 14, 0.7) 0%,
        rgba(11, 11, 14, 0.2) 30%,
        rgba(11, 11, 14, 0.3) 60%,
        rgba(11, 11, 14, 0.95) 85%,
        #0B0B0E 100%
      );
  }

  /* Grain */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 8;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.1'/%3E%3C/svg%3E");
    background-size: 256px;
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 5;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 70px;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .birthday-tag {
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.7);
  }

  .date-small {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 3px;
    color: #B6FF00;
  }

  .center-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-bottom: 40px;
  }

  .artist-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 200px;
    line-height: 0.82;
    letter-spacing: -3px;
    text-transform: uppercase;
    color: #FFFFFF;
    mix-blend-mode: difference;
  }

  .artist-name .neon {
    color: #B6FF00;
    text-shadow:
      0 0 40px rgba(182, 255, 0, 0.5),
      0 0 100px rgba(182, 255, 0, 0.2);
  }

  .sub-info {
    display: flex;
    align-items: center;
    gap: 32px;
    margin-top: 36px;
  }

  .live-dj {
    font-weight: 300;
    font-size: 16px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #FFFFFF;
  }

  .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #9FA3A7;
  }

  .venue {
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #9FA3A7;
  }

  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .event-date-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px;
    line-height: 1;
    letter-spacing: 2px;
    color: #FFFFFF;
  }

  .tagline {
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.35);
    text-align: right;
    line-height: 1.8;
  }
</style>
</head>
<body>
<div class="flyer">
  <div class="bg-image">
    <img src="https://iwdr7kqxwo00nm51.public.blob.vercel-storage.com/images/standalone/1769736137927-Ashley-119.webp" alt="Ashley">
  </div>
  <div class="overlay"></div>
  <div class="grain"></div>

  <div class="content">
    <div class="top-bar">
      <div class="birthday-tag">It's My Birthday</div>
      <div class="date-small">2.20</div>
    </div>

    <div class="center-content">
      <div class="artist-name">
        <span class="neon">What</span><br>
        So Not
      </div>
      <div class="sub-info">
        <span class="live-dj">Live DJ Set</span>
        <span class="dot"></span>
        <span class="venue">Audio</span>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="event-date-big">Friday<br>2.20</div>
      <div class="tagline">Bass heavy.<br>Late night.<br>Unforgettable.</div>
    </div>
  </div>
</div>
</body>
</html>
