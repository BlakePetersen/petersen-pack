<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 -12 76 130" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round">
  <!-- Crescent moon - filled -->
  <path d="M 50 25 A 15 15 0 1 1 50 75 A 13 25 0 0 0 50 25 Z" fill="currentColor" stroke="none" />

  <!-- Sun rays - varying lengths -->
  <!-- Top (12 o'clock) - extra long, touching crescent -->
  <line x1="50" y1="2" x2="50" y2="25" stroke-width="5" />

  <!-- Top-right diagonal (1:30) - medium -->
  <line x1="76" y1="24" x2="68" y2="32" stroke-width="4" />

  <!-- Right (3 o'clock) - shortest, touching outside of crescent -->
  <line x1="75" y1="50" x2="83" y2="50" stroke-width="3" />

  <!-- Bottom-right diagonal (4:30) - medium -->
  <line x1="76" y1="76" x2="68" y2="68" stroke-width="4" />

  <!-- Bottom (6 o'clock) - extra long, touching crescent -->
  <line x1="50" y1="75" x2="50" y2="98" stroke-width="5" />

  <!-- Bottom-left diagonal (7:30) - medium -->
  <line x1="24" y1="76" x2="32" y2="68" stroke-width="3" />

  <!-- Left (9 o'clock) - shortest, mirrored distance -->
  <line x1="17" y1="50" x2="25" y2="50" stroke-width="3" />

  <!-- Top-left diagonal (10:30) - medium -->
  <line x1="24" y1="24" x2="32" y2="32" stroke-width="4" />

  <!-- Rounded caps for outer ends -->
  <circle cx="50" cy="-7" r="0.5" fill="currentColor" />
  <circle cx="50" cy="2" r="0.5" fill="currentColor" />
  <circle cx="76" cy="24" r="0.25" fill="currentColor" />
  <circle cx="83" cy="50" r="0.125" fill="currentColor" />
  <circle cx="76" cy="76" r="0.25" fill="currentColor" />
  <circle cx="50" cy="98" r="0.5" fill="currentColor" />
  <circle cx="50" cy="107" r="0.5" fill="currentColor" />
  <circle cx="50" cy="117" r="0.5" fill="currentColor" />
  <circle cx="24" cy="76" r="0.25" fill="currentColor" />
  <circle cx="17" cy="50" r="0.125" fill="currentColor" />
  <circle cx="24" cy="24" r="0.25" fill="currentColor" />
</svg>
